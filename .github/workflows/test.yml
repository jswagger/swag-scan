name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test "skills/bug-hunter/test/*.test.mjs" "skills/code-sweeper/test/*.test.mjs" "skills/security-auditor/test/*.test.mjs" "skills/review-tools-common/test/*.test.mjs"
